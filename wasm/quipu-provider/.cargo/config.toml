# Browser-only crate. The getrandom cfg is the documented opt-in for its
# wasm_js backend — see quipu's docs/design/wasm-support.md §4.4.
[build]
target = "wasm32-unknown-unknown"
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# libgit2 can't traverse authenticating proxies; the git CLI can.
[net]
git-fetch-with-cli = true
